<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=presentations/presentation.en.html">
<title>MiniMax H3 opencode Prompt Director — Direcionando para a apresentação</title>
<style>
  :root {
    --bg: #0d0f1a;
    --panel: #161a30;
    --accent: #7c6cff;
    --accent2: #00d4b0;
    --text: #e8eaf6;
    --muted: #9aa0c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(900px 600px at 30% -10%, #232a55 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    text-align: center;
    padding: 24px;
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 22px; color: #fff;
  }
  h1 { font-size: 24px; font-weight: 700; }
  p { color: var(--muted); max-width: 420px; line-height: 1.55; }
  a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,108,255,.35); }
  .note { font-size: 13px; color: var(--panel); }
</style>
</head>
<body>
  <div class="logo">H3</div>
  <h1>MiniMax H3 opencode Prompt Director</h1>
  <p>Se você não for redirecionado automaticamente, clique no botão abaixo para abrir a apresentação.</p>
  <a href="presentations/presentation.en.html">Abrir apresentação</a>
  <p class="note">EN: <a href="presentations/presentation.en.html" style="background:none;padding:0;color:#00d4b0;">english deck</a></p>
</body>
</html>
